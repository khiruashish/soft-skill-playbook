      - Building Confidence: foundations/building-confidence.md
      - Improving Soft Skills (90-Day Plan): foundations/improving-soft-skills.md
      - Burnout & Wellbeing: foundations/burnout.md
  - Workplace:
      - workplace/index.md
      - Talking to Your Manager: workplace/talking-to-manager.md
      - Talking to Juniors: workplace/talking-to-juniors.md
      - Talking to the CEO & Executives: workplace/talking-to-ceo.md
      - Peers & Cross-Team: workplace/peers-and-cross-team.md
      - Explaining an Issue: workplace/explaining-issues.md
      - Day-to-Day Communication: workplace/day-to-day.md
      - Meetings & Presentations: workplace/meetings-and-presentations.md
      - Difficult Conversations: workplace/difficult-conversations.md
      - Team Lead Meetings: workplace/team-lead-meetings.md
      - Global & Remote Teams: workplace/global-and-remote-teams.md
      - Mentoring: workplace/mentoring.md
      - Team Building: workplace/team-building.md
      - Work from Home: workplace/work-from-home.md
      - Leave & Boundaries: workplace/leave-and-boundaries.md
      - Client Meetings: workplace/client-meeting.md
      - Office Party & Team Events: workplace/office-party.md
  - Career:
