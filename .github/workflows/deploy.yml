name: Deploy to GitHub Pages

# Builds the MkDocs site and publishes it to the `gh-pages` branch.
# Pages setting: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and push to gh-pages
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs gh-deploy --force --clean --strict --message "Deploy {sha} with MkDocs {version}"
